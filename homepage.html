<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Britestar</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        
        header {
            background-color: #222;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 2rem;
        }
        
        nav a:hover {
            color: #ffd700;
        }
        
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 6rem 2rem;
            text-align: center;
        }
        
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        section {
            margin: 2rem 0;
        }
        
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>Britestar</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    
    <section class="hero">
        <h1>Welcome to Britestar</h1>
        <p>Your vision, our expertise</p>
    </section>
    
    <div class="container">
        <section id="about">
            <h2>About Us</h2>
            <p>Add your content here.</p>
        </section>
        
        <section id="services">
            <h2>Services</h2>
            <p>Add your services here.</p>
        </section>
        
        <section id="contact">
            <h2>Contact</h2>
            <p>Add your contact information here.</p>
        </section>
    </div>
    
    <footer>
        <p>&copy; 2024 Britestar. All rights reserved.</p>
    </footer>
</body>
</html>
