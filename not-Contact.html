<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Britestar</title>
    <link rel="stylesheet" href="style.css">
</head>
<contact-body>
    <div class="contact-us-box">
        <h1>Contact Us</h1>
        <p>Feel free to ask any questions, or raise any concerns, or let us now about anything!</p>
        <div class="contact-box">
            <div class="contact-left">
                <h3>Sent your request</h3>
                <form>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Name </label>
                            <input type="text" placeholder="Enter Name">
                        </div>
                        <div class="input-group">
                            <label>Phone</label>
                            <input type="text" placeholder="Enter Phone No.">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Email </label>
                            <input type="text" placeholder="Enter Email">
                        </div>
                        <div class="input-group">
                            <label>Subject</label>
                            <input type="text" placeholder="Subject">
                        </div>
                    </div>

                    <label>Message</label>
                    <textarea rows="5"placeholder="Your Message"></textarea>
                    <button type="submit">Send</button>
                </form>
            </div>
            <div class="contact-right">
                <h3>Reach Us</h3>

                <table>
                    <tr>
                        <td>Email:</td>
                        <td><a href="fake@idk.com">fake@idk.com</a></td>
                    </tr>
                    <tr>
                        <td>Phone:</td>
                        <td><a href="+123456789">+123456789</a></td>
                    </tr>
                    <tr>
                        <td>Address:</td>
                        <td><a href="idk street">idk street</a></td>
                    </tr>

                </table>


            </div>
        </div>
    </div>
</body>
</html>
