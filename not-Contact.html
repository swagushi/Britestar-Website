<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Britestar</title>
    <link rel="stylesheet" href="style.css">
</head>
<contact-body>
    <div class="contact-us-box">
        <h1>Contact Us</h1>
        <p>Feel free to ask any questions, or raise any concerns, or let us now about anything!</p>
        <div class="contact-box">
            <div class="contact-left">
                <h3>Sent your request</h3>
                <form>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Name </label>
                            <input type="text" placeholder="Enter Name">
                        </div>
                        <div class="input-group">
                            <label>Phone</label>
                            <input type="text" placeholder="Enter Phone No.">
                        </div>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Email </label>
                            <input type="text" placeholder="Enter Email">
                        </div>
                        <div class="input-group">
                            <label>Subject</label>
                            <input type="text" placeholder="Subject">
                        </div>
                    </div>

                    <label>Message</label>
                    <textarea rows="5"placeholder="Your Message"></textarea>
                    <button type="submit">Send</button>
                </form>
            </div>
            <div class="contact-right">
                <h3>Reach Us</h3>

                <table>
                    <tr>
                        <td>Email:</td>
                        <td><a href="fake@idk.com">fake@idk.com</a></td>
                    </tr>
                    <tr>
                        <td>Phone:</td>
                        <td><a href="+123456789">+123456789</a></td>
                    </tr>
                    <tr>
                        <td>Address:</td>
                        <td><a href="idk street">idk street</a></td>
                    </tr>

                </table>


            </div>
        </div>
    </div>
</body>

<style>
    /* not contact us */
*{
  margin: 0;
  padding: 0;
 }
body{
    background: #55ffe5;
    font-size: 14px;
    font-family: Arial, sans-serif;
  }
  .contact-us-box{
    width: 100%;
    margin: 50px auto;
  }

.contact-box{
  background: #fff;
  display: flex;
}
.contact-left{
  flex-basis: 60%;
  padding: 40px 60px;
}
.contact-right{
  flex-basis: 40%;
  padding: 40px;
  background: #1c00b5;
  color: #fff;
}
h1{
  margin-top: 10px;
  text-align: left;

}
.contact-us-box p{
  margin-bottom: 40px;
}
.input-row{
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}
.input-row .input-group{
  flex-basis: 45%;

}
input{
  width: 100%;
  border: none;
  border-bottom: 1px solid #ccc;
  padding-bottom: 5px;
}
textarea{
  width: 100%;
  border: 1px solid #ccc;
  outline: none;
  padding: 10px;
  box-sizing: border-box;
}
label{
  margin-bottom: 6px;
  display: block;
  color: #1c00b5;
}
button{
  background: #1c00b5;
  width: 100px;
  border: none;
  outline: none;
  color: #fff;
  height: 35px;
  border-radius: 30px;
  margin-top: 20px;
  box-shadow: 0px 5px 15px 0px rgba(28,0,181,0.3);
}
.contact-left h3{
  color: #1c00b5;
  font-weight: 600;
  margin-bottom: 30px;

}
.contact-right h3{
  font-weight: 600;
  margin-bottom: 30px;

}
tr td:first-child{
  padding-right: 20px;

}
tr td{
  padding-top: 20px;
}

</style>

</html>
